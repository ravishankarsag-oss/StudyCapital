# ══════════════════════════════════════════════════════════════════════════════
#  StudyCapital — Deploy Static Site
#  Triggers when any HTML/JS/CSS/config file changes on the main branch
#  Deploys to Cloudflare Pages (recommended) OR via FTP to shared hosting
# ══════════════════════════════════════════════════════════════════════════════

name: 🌐 Deploy Static Site

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.json'
      - '**.xml'
      - '**.txt'
      - '.htaccess'
      - 'sw.js'
      - 'manifest.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'favicon-*.png'
      - 'apple-touch-icon.png'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  #  OPTION A — Cloudflare Pages (recommended — free, fast, global CDN)
  #  Comment this job out if you use FTP/cPanel instead
  # ════════════════════════════════════════════════════════════════════════════
  deploy-cloudflare-pages:
    name: Deploy → Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy all files in repo root as a Pages project
          command: pages deploy . --project-name=studycapital --commit-dirty=true

      - name: ✅ Pages deployment complete
        run: |
          echo "✅ Static site deployed to Cloudflare Pages!"
          echo "🔗 Live URL: https://www.studycapital.in"
          echo "📅 Deployed at: $(date -u)"

  # ════════════════════════════════════════════════════════════════════════════
  #  OPTION B — FTP / cPanel shared hosting
  #  Uncomment this job if your site is on shared hosting (Hostinger, GoDaddy etc.)
  #  Comment out the Cloudflare Pages job above if using this
