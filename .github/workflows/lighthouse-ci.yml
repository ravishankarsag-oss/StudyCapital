# ══════════════════════════════════════════════════════════════════════════════
#  StudyCapital — Lighthouse CI Audit
#  Runs after deploy to main to track score over time
#  Fails if scores drop below thresholds
# ══════════════════════════════════════════════════════════════════════════════

name: 🔍 Lighthouse CI Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    name: Run Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: ⏳ Wait for Cloudflare Pages to propagate
        run: sleep 30

      - name: 🔍 Run Lighthouse CI
        run: lhci autorun --collect.url="https://www.studycapital.in/"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
